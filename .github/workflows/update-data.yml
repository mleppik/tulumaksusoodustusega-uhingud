name: Update data

on:
  schedule:
    # Daily check; the source list changes roughly once a month.
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4

      - name: Install poppler (pdftotext)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends poppler-utils

      - name: Download and parse the official PDF
        run: python3 scripts/update_data.py

      - name: Commit and push if the data changed
        id: commit
        run: |
          if git diff --quiet -- site/data.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No changes in data."
          else
            asof=$(python3 -c "import json; print(json.load(open('site/data.json'))['asOf'])")
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add site/data.json
            git commit -m "data: update list (seisuga $asof)"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  # Pushes made with the default GITHUB_TOKEN do not trigger other workflows,
  # so deploy explicitly after a data commit.
  deploy:
    needs: update
    if: needs.update.outputs.changed == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy.yml
